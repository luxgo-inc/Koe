name: Koe
options:
  bundleIdPrefix: jp.luxgo
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
packages:
  KoePackage:
    path: .
  # 話者分離（オンデバイス pyannote/CoreML）。iOS アプリのみの依存で、
  # SwiftPM パッケージ本体（macOS 版）は外部依存ゼロを維持する。
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: 0.15.6
targets:
  KoeIOS:
    type: application
    platform: iOS
    sources:
      - ios/KoeIOS
    dependencies:
      - package: KoePackage
        product: KoeCore
      - package: KoePackage
        product: KoeKit
      - package: FluidAudio
        product: FluidAudio
    configFiles:
      Debug: ios/Config.xcconfig
      Release: ios/Config.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.luxgo.koe.ios
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        # FluidAudio 同梱の Rust 静的ライブラリが arm64 のみのため、
        # シミュレータの x86_64 スライスを除外する（Apple Silicon Mac 前提）
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    info:
      path: ios/KoeIOS/Info.plist
      properties:
        CFBundleDisplayName: Koe
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: 会議やメモを録音してオンデバイスで文字起こしするためにマイクを使用します。
        NSSpeechRecognitionUsageDescription: 音声をオンデバイスで文字起こしするために使用します。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        GoogleOAuthClientID: $(GOOGLE_OAUTH_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_OAUTH_URL_SCHEME)
